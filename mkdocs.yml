site_name: SQ
site_description: SQ is a lightweight, self-hosted project tracker for people with seventeen projects and one attention span.
site_url: https://syracuse3dprintingorg.github.io/ProjectTracker/
repo_url: https://github.com/Syracuse3DPrintingOrg/ProjectTracker
repo_name: ProjectTracker

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Welcome: index.md
  - Getting started: getting-started.md
  - Boards and cards: boards.md
  - Today's Tasks and wall displays: today-and-displays.md
  - Attachments and previews: attachments-and-previews.md
  - AI features: ai-features.md
  - Integrations: integrations.md
  - Administration: administration.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
