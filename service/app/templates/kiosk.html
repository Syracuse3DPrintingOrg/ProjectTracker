<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Today" }}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#04050a">
  <style>
    :root {
      --bg: #04050a; --surface: #0c0f18; --border: #2c3453;
      --text: #f4f6fc; --muted: #9ba5c4;
      --accent: #8a63ff; --accent-2: #2ee6ff;
      --ok: #2fe38a; --warn: #ffb224; --danger: #ff4d6d;
      --unit: calc(3.4vh * {{ scale }});
    }
    body.theme-light { --bg: #f4f5f7; --surface: #fff; --text: #1c1e22; --muted: #5c6470; --border: #d8dbe0; }
    body.theme-contrast { --bg: #000; --surface: #0a0a0a; --text: #fff; --muted: #bbb; --border: #333; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: var(--unit)/1.3 system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      padding: 2.5vh 3vw; user-select: none;
    }
    body.tv { padding: 5vh 6vw; }
    header { display: flex; align-items: baseline; gap: 1.5vw; margin-bottom: 1vh; }
    h1 { font-size: calc(var(--unit) * 1.25); margin: 0; }
    .date { color: var(--muted); font-size: calc(var(--unit) * 0.72); }
    .clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: calc(var(--unit) * 1.1); }
    .exit {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 3px; font-size: calc(var(--unit) * 0.7);
      padding: 0.2em 0.6em; margin-left: 1vw; cursor: pointer;
    }
    .progress { height: 1vh; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 1.6vh; }
    .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0%; transition: width 0.5s; }
    #tasks { flex: 1; overflow-y: auto; }
    .task {
      display: flex; align-items: center; gap: 2vw;
      background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
      padding: 1.6vh 2vw; margin-bottom: 1.2vh; cursor: pointer;
      transition: opacity 0.25s, transform 0.1s;
    }
    .task:active { transform: scale(0.99); }
    .task .box { font-size: calc(var(--unit) * 1.1); color: var(--muted); flex-shrink: 0; }
    .task .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .task .meta { color: var(--muted); font-size: calc(var(--unit) * 0.65); white-space: nowrap; text-align: right; }
    .task .due-badge { color: var(--warn); }
    .task .due-badge.overdue { color: var(--danger); font-weight: 700; }
    .task.done { opacity: 0.4; }
    .task.done .title { text-decoration: line-through; }
    .task.done .box { color: var(--ok); }
    .task.p0, .task.p1 { border-left: 4px solid var(--danger); }
    .empty { color: var(--muted); text-align: center; margin-top: 8vh; font-size: calc(var(--unit) * 1.05); }
    footer { color: var(--muted); font-size: calc(var(--unit) * 0.68); padding-top: 1.2vh; display: flex; gap: 2vw; }
    footer .offline { color: var(--warn); }
    footer .spacer { flex: 1; }
    .toast {
      position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--warn); color: var(--text);
      padding: 1vh 2vw; border-radius: 3px; font-size: calc(var(--unit) * 0.7);
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="theme-{{ theme }}{% if tv %} tv{% endif %}">
  <header>
    <h1>{{ title or "Today" }}</h1>
    <span class="date" id="date"></span>
    <span class="clock" id="clock"></span>
    <button class="exit" id="exit" hidden title="Leave kiosk mode">&#10005;</button>
  </header>
  <div class="progress"><div id="bar"></div></div>
  <div id="tasks"></div>
  <div class="empty" id="empty" hidden>Nothing on the list. The squirrel approves.</div>
  <footer>
    <span id="status"></span>
    <span class="spacer"></span>
    <span id="extras"></span>
  </footer>
  <div class="toast" id="toast"></div>

  <script>
    const HIDE_DONE = {{ 'true' if hide_done else 'false' }};
    const qs = new URLSearchParams(window.location.search);
    const token = qs.get("token");
    const suffix = token ? "?token=" + encodeURIComponent(token) : "";
    let busy = false;

    function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }

    function render(data) {
      const today = new Date().toISOString().slice(0, 10);
      let tasks = data.tasks;
      if (HIDE_DONE) tasks = tasks.filter(t => !t.done);
      document.getElementById("tasks").innerHTML = tasks.map(t => {
        const overdue = t.due && t.due < today && !t.done;
        let meta = "";
        if (t.checklist) meta += `<div>&#9745; ${esc(t.checklist)}</div>`;
        if (t.due) meta += `<div class="due-badge ${overdue ? "overdue" : ""}">${esc(t.due)}</div>`;
        meta += `<div>${esc(t.project)}</div>`;
        return `<div class="task ${t.done ? "done" : ""} p${t.priority}" data-id="${t.id}">` +
          `<span class="box">${t.done ? "✓" : "▢"}</span>` +
          `<span class="title">${esc(t.title)}</span>` +
          `<span class="meta">${meta}</span></div>`;
      }).join("");
      document.getElementById("empty").hidden = tasks.length > 0;
      const done = data.tasks.length - data.remaining;
      document.getElementById("bar").style.width =
        data.tasks.length ? (100 * done / data.tasks.length) + "%" : "0%";
      document.getElementById("status").textContent =
        data.tasks.length ? `${data.remaining} to go` : "";
      const extras = [];
      if (data.overdue) extras.push(`${data.overdue} overdue on the boards`);
      if (data.stalest) extras.push(`\u{1F43F}️ ${data.stalest.name} is ${data.stalest.days_quiet}d quiet`);
      document.getElementById("extras").textContent = extras.join("  ·  ");
    }

    async function refresh() {
      try {
        const resp = await fetch("/api/kiosk/data" + suffix, { cache: "no-store" });
        if (!resp.ok) throw new Error(resp.status);
        render(await resp.json());
      } catch (e) {
        document.getElementById("status").innerHTML =
          '<span class="offline">Connection lost, retrying&hellip;</span>';
      }
    }

    document.getElementById("tasks").addEventListener("click", async (e) => {
      const el = e.target.closest(".task");
      if (!el || busy) return;
      busy = true;
      el.classList.toggle("done");   // optimistic
      try {
        const resp = await fetch(`/api/kiosk/toggle/${el.dataset.id}` + suffix, { method: "POST" });
        if (resp.status === 403) {
          el.classList.toggle("done");
          toast("Viewers can look but not touch.");
        } else if (!resp.ok) {
          throw new Error(resp.status);
        }
        await refresh();
      } catch (err) {
        el.classList.toggle("done");
        toast("That didn't stick. Retrying the list.");
        await refresh();
      } finally {
        busy = false;
      }
    });

    function tick() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      document.getElementById("date").textContent =
        now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    }

    // Per-device kiosk preference: the exit button shows only when this
    // browser opted in (a registered wall screen has no flag to clear).
    if (localStorage.getItem("sq_kiosk") === "1") {
      const exit = document.getElementById("exit");
      exit.hidden = false;
      exit.addEventListener("click", () => {
        localStorage.removeItem("sq_kiosk");
        window.location.href = "/";
      });
    }

    tick();
    refresh();
    setInterval(tick, 5000);
    setInterval(refresh, 10000);
  </script>
</body>
</html>
