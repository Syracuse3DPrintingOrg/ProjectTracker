<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#04050a">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/" title="SQ: squirrel-brained project tracking">&#128063; {{ app_title }}</a>
  <div class="nav-pills">
    <a class="pill" href="/">Boards</a>
    <a class="pill" href="/today">Today</a>
    <a class="pill" href="/calendar">Calendar</a>
    <a class="pill" href="/dashboard/claude-code">Claude Code</a>
    <a class="pill" href="/displays">Displays</a>
  </div>
  <div class="nav-links">
    {% block nav %}{% endblock %}
    <a href="/search" title="Search">&#128269;</a>
    <a href="/settings">Settings</a>
    {% if auth_required %}<a href="/logout">Log out</a>{% endif %}
  </div>
</nav>
<script>
  (function () {
    var path = window.location.pathname;
    document.querySelectorAll(".nav-pills .pill").forEach(function (a) {
      var target = a.getAttribute("href");
      var active = target === "/"
        ? (path === "/" || path.startsWith("/project/"))
        : path.startsWith(target);
      if (active) a.classList.add("active");
    });
  })();
</script>
<main class="page">
{% block content %}{% endblock %}
</main>
<footer class="footer">{{ app_title }} v{{ version }} &middot; easily distracted, reliably tracked &#128063;</footer>
{% block scripts %}{% endblock %}
</body>
</html>
