<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Today's Tasks" }}</title>
  <style>
    :root {
      --bg: #0d0f12; --text: #e8eaf0; --muted: #8b93a3;
      --line: #21252c; --ok: #3fb950; --warn: #d29922; --danger: #e05561;
      --unit: calc(3.2vh * {{ scale }});
    }
    body.theme-light {
      --bg: #f4f5f7; --text: #1c1e22; --muted: #5c6470; --line: #d8dbe0;
    }
    body.theme-contrast {
      --bg: #000; --text: #fff; --muted: #bbb; --line: #333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: var(--unit)/1.35 system-ui, sans-serif;
      min-height: 100vh; padding: 3vh 4vw;
      cursor: none;
    }
    body.tv { padding: 5vh 6vw; }  /* overscan-safe margins */
    header { display: flex; align-items: baseline; gap: 1.5vw; }
    h1 { font-size: calc(var(--unit) * 1.3); margin: 0 0 1vh; }
    .clock { margin-left: auto; color: var(--muted); font-size: calc(var(--unit) * 1.1); font-variant-numeric: tabular-nums; }
    .sub { color: var(--muted); font-size: calc(var(--unit) * 0.75); margin-bottom: 2vh; }
    .sub .offline { color: var(--warn); }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; gap: 1.2vw; padding: 1.3vh 0; border-bottom: 1px solid var(--line); align-items: baseline; }
    li .box { color: var(--muted); flex-shrink: 0; }
    li .title { overflow: hidden; text-overflow: ellipsis; }
    li.done { opacity: 0.45; }
    li.done .title { text-decoration: line-through; }
    li.done .box { color: var(--ok); }
    li.p0 .box, li.p1 .box { color: var(--danger); }
    .proj { color: var(--muted); font-size: calc(var(--unit) * 0.72); margin-left: auto; white-space: nowrap; }
    .due { color: var(--warn); font-size: calc(var(--unit) * 0.72); white-space: nowrap; }
    .due.overdue { color: var(--danger); font-weight: 700; }
    .empty { color: var(--muted); margin-top: 8vh; text-align: center; font-size: calc(var(--unit) * 1.1); }
    .progress { height: 0.8vh; background: var(--line); border-radius: 99px; margin: 0 0 2vh; overflow: hidden; }
    .progress > div { height: 100%; background: var(--ok); width: 0%; transition: width 0.6s; }
  </style>
</head>
<body class="theme-{{ theme }}{% if tv %} tv{% endif %}">
  <header>
    <h1>{{ title or "Today's Tasks" }}</h1>
    {% if clock %}<div class="clock" id="clock"></div>{% endif %}
  </header>
  <div class="sub" id="sub">Loading&hellip;</div>
  <div class="progress"><div id="bar"></div></div>
  <ul id="tasks"></ul>
  <div class="empty" id="empty" hidden>Nothing on the list. Enjoy the slack.</div>
  <script>
    const HIDE_DONE = {{ 'true' if hide_done else 'false' }};
    const LIST = {{ list | tojson }};
    const qs = new URLSearchParams(window.location.search);
    const token = qs.get("token");
    const urlQs = new URLSearchParams();
    if (token) urlQs.set("token", token);
    if (LIST) urlQs.set("list", LIST);
    const url = "/api/display" + (urlQs.toString() ? "?" + urlQs.toString() : "");
    let lastPayload = "";

    function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

    function localDateStr() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function render(data) {
      const today = localDateStr();
      let tasks = data.tasks;
      if (HIDE_DONE) tasks = tasks.filter(t => !t.done);
      document.getElementById("tasks").innerHTML = tasks.map(t => {
        const overdue = t.due && t.due < today && !t.done;
        return `<li class="${t.done ? "done" : ""} p${t.priority}">` +
          `<span class="box">${t.done ? "✓" : "▢"}</span>` +
          `<span class="title">${esc(t.title)}</span>` +
          (t.checklist ? `<span class="proj">☑ ${esc(t.checklist)}</span>` : "") +
          (t.due ? `<span class="due ${overdue ? "overdue" : ""}">${esc(t.due)}</span>` : "") +
          `<span class="proj">${esc(t.project)}</span></li>`;
      }).join("");
      document.getElementById("empty").hidden = tasks.length > 0;
      const done = data.count - data.remaining;
      document.getElementById("bar").style.width = data.count ? (100 * done / data.count) + "%" : "0%";
      document.getElementById("sub").innerHTML =
        data.count ? `${data.remaining} of ${data.count} remaining` : "";
    }

    async function refresh() {
      try {
        const resp = await fetch(url, { cache: "no-store" });
        if (!resp.ok) throw new Error(resp.status);
        const text = await resp.text();
        // Compare without the timestamp, or every poll looks like a change.
        const comparable = text.replace(/"generated_at":"[^"]*",?/, "");
        if (comparable !== lastPayload) {   // repaint only on change, kind to e-ink and OLED
          lastPayload = comparable;
          render(JSON.parse(text));
        }
      } catch (e) {
        document.getElementById("sub").innerHTML =
          '<span class="offline">Connection lost, retrying&hellip;</span>';
        lastPayload = "";
      }
    }

    function tickClock() {
      const el = document.getElementById("clock");
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    refresh();
    tickClock();
    setInterval(refresh, 15000);
    setInterval(tickClock, 5000);
  </script>
</body>
</html>
