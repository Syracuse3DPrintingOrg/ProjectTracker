name: Publish image

# Publishes ghcr.io/syracuse3dprintingorg/projecttracker on every release
# (plus manual runs). The image name is pinned on purpose; never derive it
# from github.repository.
#
# NOTE: org Actions billing currently blocks all workflow runs (SQ-0mc).
# This workflow is ready and will work as soon as billing is fixed.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          v=$(grep -oP 'APP_VERSION = "\K[^"]+' service/app/config.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/syracuse3dprintingorg/projecttracker:latest
            ghcr.io/syracuse3dprintingorg/projecttracker:${{ steps.version.outputs.version }}
