name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r service/requirements.txt pytest
      - run: python -m pytest tests/ -q
      - name: Import smoke test
        run: python -c "import sys; sys.path.insert(0,'service'); from app.main import app"
